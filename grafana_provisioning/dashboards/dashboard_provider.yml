# ./provisioning/dashboards/dashboard_provider.yml
apiVersion: 1

providers:
  - name: 'HEARTS360 Dashboards'
    orgId: 1
    folder: 'HEARTS360 Dashboards'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    options:
      path: '/tmp/grafana-provisioning-runtime/dashboards/HEARTS360 Dashboards'
      foldersFromFilesStructure: false

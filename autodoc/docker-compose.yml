services:
  db:
    image: ${HEART360_AUTODOC_DB_IMAGE-simpledotorg/heart360tk-postgresql:latest}
    ports:
      # Defaults to 5433 so the autodoc stack never collides with a running
      # HEARTS360 core stack (or a local PostgreSQL) on 5432.
      - "${HEART360_AUTODOC_DB_PORT-5433}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "db_prod"]
      interval: 5s
      timeout: 60s
      retries: 5
      start_period: 80s


  schemaspy:
    image: ${HEART360_SCHEMASPY_IMAGE-schemaspy/schemaspy:6.2.4}
    volumes:
      - ./schemaspy-output:/output
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: >
      -t pgsql 
      -host db 
      -port 5432 
      -db ${HEART360_DB_NAME-heart360tk_database} 
      -u ${HEART360_DB_APP_USER-heart360tk}
      -p ${HEART360_DB_APP_PASSWORD-YmE4ZTk0OGI0OTNmNGU5YmFjZDY1YTA0}
      -norows



 